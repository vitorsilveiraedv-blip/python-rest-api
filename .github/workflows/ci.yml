name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_desk
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: service_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U service_desk -d service_desk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate database migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://service_desk:ci_password@localhost:5432/service_desk
        run: alembic upgrade head
      - name: Run tests
        run: pytest --cov=service_desk_api --cov-report=term-missing
